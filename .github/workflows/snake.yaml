name: Generate Contribution Snake

on:
  # Rebuild twice a day so the snake always matches your real activity
  schedule:
    - cron: "0 */12 * * *"
  # Lets you trigger it by hand from the Actions tab
  workflow_dispatch:
  # Rebuild whenever you push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: RomanAkmal
          outputs: |
            dist/github-snake.svg?color_snake=#6b21a8&color_dots=#f3e8ff,#d8b4fe,#a855f7,#7c3aed,#4c1d95
            dist/github-snake-dark.svg?color_snake=#a855f7&color_dots=#1a0533,#4c1d95,#7c3aed,#a855f7,#d8b4fe

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
